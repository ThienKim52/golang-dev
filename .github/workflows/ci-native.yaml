name: ci-pipeline
on: 

  pull_request:
    branches: [ "main" ]
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    
jobs:
  ci_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Run unit test
        run: make test

      - name: Log in to Docker
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7
        with:
          username :
            ${{ secrets.DOCKER_USERNAME }}
          password:
            ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          push: true
          tags: |
            kimthanthien/bookmark:v1.0.0
            kimthanthien/bookmark:latest
