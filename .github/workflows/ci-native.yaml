name: ci-pipeline
on:

  pull_request:
    branches: [ "main" ]
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+. [0-9]+. [0-9]+'
    
jobs:
  ci_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: run unit test
        run: make test

      - name: login to docker
        uses: docker/login-action@v4
        with:
          username :
            ${{ secrets.DOCKER_USERNAME }}
          password:
            ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: kimthanthien/bookmark:dev
