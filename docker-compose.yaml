version: '3.7'

services:
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"


  bookmark_service:
    image: bookmark-service-test:latest
    build: .
    container_name: bookmark-service
    depends_on:
    - redis
    ports:
    - "8080:8080"
    environment:
    - ADDRESS=redis:6379
